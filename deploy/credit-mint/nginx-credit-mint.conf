# nginx location blocks for the credit mint's public address (docs/FREE-TIER.md). Put them inside the
# server { } block for that address, after its TLS settings. Not deployed by this repository.
#
# Only the endpoints a holder needs are public: info, keys, keysets, swap and checkstate. Everything
# else, minting and melting above all, answers 404 from outside. Credits are issued on this host only,
# through 127.0.0.1:3348 (scripts/issue-credits.ts, and the gateway's faucet via FORGE_CREDIT_MINT_ISSUE_URL).

location = /v1/info { limit_except GET { deny all; } proxy_pass http://127.0.0.1:3348; }
location = /v1/keys { limit_except GET { deny all; } proxy_pass http://127.0.0.1:3348; }
location ~ ^/v1/keys/[0-9a-fA-F]+$ { limit_except GET { deny all; } proxy_pass http://127.0.0.1:3348; }
location = /v1/keysets { limit_except GET { deny all; } proxy_pass http://127.0.0.1:3348; }
location = /v1/swap { limit_except POST { deny all; } client_max_body_size 64k; proxy_pass http://127.0.0.1:3348; }
location = /v1/checkstate { limit_except POST { deny all; } client_max_body_size 64k; proxy_pass http://127.0.0.1:3348; }

# Everything else: minting (/v1/mint/...), melting (/v1/melt/...), restore, websockets and any later route.
location / { return 404; }
