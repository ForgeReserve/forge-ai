import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// The repository root: the web app (public/) and the script that bundles it live there.
def repoRoot = rootProject.projectDir.parentFile
def appVersion = new JsonSlurper().parse(new File(repoRoot, 'package.json')).version

android {
    namespace "com.forgereserve.ai"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.forgereserve.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Raise versionCode by one for every APK published at /download, or phones will not update.
        versionCode 3
        versionName appVersion
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir (Capacitor's default).
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // The natural voice's model and voices go in uncompressed: they barely compress, and the
            // web view reads them straight from the APK without inflating 65 MB first. So does Forge
            // Private Voice's speech to text model (.ort), which sherpa-onnx reads from the APK in place.
            noCompress 'gguf', 'safetensors', 'ort'
        }
    }
    // Two APKs from one app (docs/ANDROID.md, Two APKs): universal is today's Forge; privatevoice is Forge
    // Private Voice, the same app plus its own speech to text (Moonshine tiny through sherpa-onnx,
    // src/privatevoice/, scripts/asr-model.ts), for phones with no on-device recogniser such as
    // GrapheneOS. Its own application id, so both can be installed side by side.
    flavorDimensions 'voice'
    productFlavors {
        universal {
            dimension 'voice'
        }
        privatevoice {
            dimension 'voice'
            applicationIdSuffix '.privatevoice'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // No signing config here. scripts/android-release.sh signs the APK with a keystore the owner
            // supplies; bundleUniversalRelease signs the Play bundle with the upload key named by the
            // environment (below).
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
}

// The web app goes into the APK: public/v2 and the shared files it imports, never v1 and never
// anything fetched at run time (scripts/android-web.ts). Runs before every build.
def webAssets = tasks.register('forgeWebAssets', Exec) {
    workingDir repoRoot
    commandLine 'node', 'scripts/android-web.ts', file('src/main/assets').absolutePath
    inputs.dir(new File(repoRoot, 'public'))
    inputs.file(new File(repoRoot, 'scripts/android-web.ts'))
    // The KEEP and SKIP rules that decide what goes in the APK.
    inputs.file(new File(repoRoot, 'scripts/lib/android-web.ts'))
    inputs.file(new File(repoRoot, 'capacitor.config.json'))
    // The natural voice, fetched at build time when missing (scripts/phonon-model.ts, pinned in lock.json).
    inputs.file(new File(repoRoot, 'scripts/phonon-model.ts'))
    inputs.file(new File(repoRoot, 'scripts/phonon/lock.json'))
    outputs.dir(file('src/main/assets/public'))
    outputs.file(file('src/main/assets/capacitor.config.json'))
    outputs.file(file('src/main/assets/capacitor.plugins.json'))
}
preBuild.dependsOn webAssets

// Forge Private Voice's speech to text (the sherpa-onnx library and the Moonshine model), fetched at build
// time when missing and checked against scripts/asr/lock.json, for privatevoice builds only.
def asrFiles = tasks.register('forgeAsrFiles', Exec) {
    workingDir repoRoot
    commandLine 'node', 'scripts/asr-model.ts'
    inputs.file(new File(repoRoot, 'scripts/asr-model.ts'))
    inputs.file(new File(repoRoot, 'scripts/asr/lock.json'))
    outputs.dir(file('src/privatevoice/jniLibs'))
    outputs.dir(file('src/privatevoice/assets'))
}
tasks.configureEach { t ->
    if (t.name ==~ /prePrivatevoice\w*Build/) t.dependsOn asrFiles
}

// The Play app bundle (docs/ANDROID.md, Google Play): universal only (Forge), signed with the upload key the
// environment names at build time, never with a debug key and never with anything in this repository.
// The APKs keep no signing config, so scripts/android-release.sh and the debug builds are unchanged.
//   FORGE_UPLOAD_KEYSTORE        the keystore file, outside the repository
//   FORGE_UPLOAD_KEY_ALIAS       the key's alias in it
//   FORGE_UPLOAD_STORE_PASSWORD  the keystore's password
//   FORGE_UPLOAD_KEY_PASSWORD    the key's password, when it differs from the keystore's
// The passwords go to jarsigner by name (-storepass:env), so they are never on a command line or in a log.
def uploadKey = { ->
    def missing = ['FORGE_UPLOAD_KEYSTORE', 'FORGE_UPLOAD_KEY_ALIAS', 'FORGE_UPLOAD_STORE_PASSWORD'].findAll { !System.getenv(it) }
    if (missing) {
        throw new GradleException("The Play bundle is signed with the upload key, and ${missing.join(', ')} ${missing.size() == 1 ? 'is' : 'are'} not set (docs/ANDROID.md, Google Play). Nothing was built.")
    }
    def ks = new File(System.getenv('FORGE_UPLOAD_KEYSTORE')).canonicalFile
    if (!ks.isFile()) throw new GradleException("No keystore at ${ks}. Nothing was built.")
    if (ks.path.startsWith(repoRoot.canonicalPath + File.separator)) {
        throw new GradleException("The keystore is inside the repository (${ks}). Move it out, so it can never be committed. Nothing was built.")
    }
    [keystore: ks, alias: System.getenv('FORGE_UPLOAD_KEY_ALIAS'),
     keyPassEnv: System.getenv('FORGE_UPLOAD_KEY_PASSWORD') ? 'FORGE_UPLOAD_KEY_PASSWORD' : 'FORGE_UPLOAD_STORE_PASSWORD']
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path == ':app:bundlePrivatevoiceRelease' }) {
        throw new GradleException('Only Forge (the universal flavour) has a Play bundle: run bundleUniversalRelease. Forge Private Voice is an APK (scripts/android-release.sh --flavour privatevoice).')
    }
    // Checked before any task runs, so a missing key stops the build at once.
    if (graph.allTasks.any { it.path == ':app:bundleUniversalRelease' }) uploadKey()
}
tasks.configureEach { t ->
    if (t.name != 'bundleUniversalRelease') return
    t.doLast {
        def key = uploadKey()
        def aab = file("build/outputs/bundle/universalRelease/app-universal-release.aab")
        if (!aab.isFile()) throw new GradleException("The build made no bundle at ${aab}.")
        def jarsigner = new File(System.getProperty('java.home'), 'bin/jarsigner').path
        def cmd = [jarsigner, '-keystore', key.keystore.path,
                   '-storepass:env', 'FORGE_UPLOAD_STORE_PASSWORD', '-keypass:env', key.keyPassEnv,
                   '-digestalg', 'SHA-256', aab.path, key.alias]
        def p = new ProcessBuilder(cmd).redirectErrorStream(true).start()
        def out = p.inputStream.text
        if (p.waitFor() != 0) throw new GradleException("jarsigner could not sign the bundle with ${key.alias} from ${key.keystore}:\n${out}")
        logger.lifecycle("Signed ${aab} with the upload key ${key.alias}.")
    }
}
