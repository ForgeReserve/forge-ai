# Production-shaped stack: gateway + Caddy (automatic HTTPS). Replace the placeholder domain.
#   docker compose up -d
#   docker compose exec gateway node src/admin.ts invites:create
services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FORGE_DB_PATH: /data/forge.db
      FORGE_TRUST_PROXY: "true"
      HOST: 0.0.0.0
      PORT: "8787"
    volumes:
      - forge-data:/data
    expose:
      - "8787"

  caddy:
    # Caddy 2.11.9, pinned by digest (the multi-arch index caddy:2 pointed at on 2026-11-13).
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    depends_on: [gateway]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Basic auth in front of /admin*. Set both in .env (see docs/ADMIN.md); the hash is single-quoted
      # there because bcrypt hashes contain "$". Compose stops with an error if the hash is missing.
      FORGE_ADMIN_BASIC_AUTH_USER: ${FORGE_ADMIN_BASIC_AUTH_USER:-admin}
      FORGE_ADMIN_BASIC_AUTH_HASH: ${FORGE_ADMIN_BASIC_AUTH_HASH:?set FORGE_ADMIN_BASIC_AUTH_HASH in .env, see docs/ADMIN.md}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  forge-data:
  caddy-data:
  caddy-config:
