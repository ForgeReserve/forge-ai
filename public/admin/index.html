<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Forge AI admin</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/admin.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#overview" aria-label="Forge AI admin">
      <svg viewBox="0 0 25 18" aria-hidden="true"><path fill="currentColor" d="M0 2.6 6.2 0H25v5.2h-4.6c-1.5 1.3-2.1 3.6-2.1 5.9H23V18H6v-6.9h5.1c0-2.3-.6-4.6-2.1-5.9H6.2Z"/></svg>
      <span>FORGE</span><em>admin</em>
    </a>
    <div class="top-right">
      <span class="pill" id="env-pill" hidden></span>
      <button class="btn ghost small" id="refresh" type="button" hidden>Refresh</button>
      <button class="btn ghost small" id="signout" type="button" hidden>Sign out</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" hidden aria-label="Sections">
    <a href="#overview">Overview</a>
    <a href="#export">Export</a>
    <a href="#invites">Invites</a>
    <a href="#waitlist">Waitlist</a>
    <a href="#balances">Balances</a>
    <a href="#fundings">Fundings</a>
    <a href="#fedimint">Fedimint</a>
    <a href="#requests">Requests</a>
    <a href="#costs">Costs</a>
    <a href="#settings">Settings</a>
  </nav>
  <main id="main" class="main">
    <section class="card login" id="login" hidden>
      <p class="kicker">Operator</p>
      <h1>Sign in</h1>
      <p class="muted">Paste the admin token. It stays in this tab only (session storage) and is sent as a header to <code>/admin/api</code>.</p>
      <form id="login-form">
        <input type="text" name="username" value="forge-admin" autocomplete="username" hidden>
        <label class="field"><span>Admin token</span><input id="token" type="password" autocomplete="current-password" required spellcheck="false" autocapitalize="off"></label>
        <p class="err" id="login-err" hidden></p>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </section>
    <div id="view" aria-live="polite"></div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
