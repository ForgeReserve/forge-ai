  <!-- First paint: the Light look's background and the two rings come with the page, so the phone shows
       them at once while the app loads. The stylesheet comes after them in the body, so it does not hold
       them up; the app draws its first screen once the stylesheet is in (app.js stylesReady). -->
  <style>
    :root { --bg: #F6F5F1; --gold-track: #F3E3BC; --memory-track: #D5F2EA; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    .boot { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
    .boot svg { width: min(336px, 82vw); height: auto; }
    @media (prefers-reduced-motion: no-preference) { .boot svg { animation: boot-breathe 2.4s ease-in-out infinite; } }
    @keyframes boot-breathe { 50% { opacity: .55; } }
    /* A phone that has not seen the first run opens on it (core/firstrun.js shouldShow): its dark ground at once. */
    :root.fr-boot { --bg: #0B0D10; }
    .fr-boot .boot svg { visibility: hidden; }
  </style>
  <script>
    try {
      if (localStorage.getItem('forge2.firstRun') !== 'done' && /^(#\/?)?$/.test(location.hash)) {
        document.documentElement.classList.add('fr-boot');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0D10');
      }
    } catch {}
  </script>

       list exactly in step with the imports). -->
