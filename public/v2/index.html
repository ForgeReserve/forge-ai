  <!-- First paint: the look's background and the two rings come with the page, so the phone shows them
       at once while the app loads. Midnight, the default look, unless this phone keeps another look
       (app.js LOOK_CACHE). The stylesheet comes after them in the body, so it does not hold them up; the
       app draws its first screen once the stylesheet is in (app.js stylesReady). -->
  <style>
    :root { --bg: #0B0D10; --gold-track: #3A3320; --memory-track: #16302C; color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    .boot { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
    .boot svg { width: min(336px, 82vw); height: auto; }
    @media (prefers-reduced-motion: no-preference) { .boot svg { animation: boot-breathe 2.4s ease-in-out infinite; } }
    @keyframes boot-breathe { 50% { opacity: .55; } }
    /* Playful mode (docs/PLAYFUL.md): its purple ground and ring tracks at once, until the app draws. */
    :root[data-boot-mode="playful"] body { background: #4B3FC9; }
    :root[data-boot-mode="playful"] .boot circle { stroke: #3A30A6; }
    /* Playful opening on its cover game: no rings on the first frame, only the game's ground. */
    :root[data-boot-cover] .boot svg { visibility: hidden; }
    /* A phone that has not seen the first run opens on it (core/firstrun.js shouldShow): its dark ground at once. */
    :root.fr-boot { --bg: #0B0D10; color-scheme: dark; }
    .fr-boot .boot svg { visibility: hidden; }
  </style>
  <script>
    (function () { try {
      var root = document.documentElement, bar = document.querySelector('meta[name="theme-color"]');
      if (localStorage.getItem('forge2.firstRun') !== 'done' && /^(#\/?)?$/.test(location.hash)) {
        root.classList.add('fr-boot');
      } else {
        // The look this phone keeps. A light one saved before Midnight became the default (no `look` in
        // it) is not used: that look is Midnight now unless the person picks Light (core/state.js).
        var c = JSON.parse(localStorage.getItem('forge2.look') || 'null'), hex = /^#[0-9a-f]{3,8}$/i;
        if (c && c.tokens && (c.look || c.scheme === 'dark') && hex.test(c.tokens.bg)) {
          root.style.setProperty('--bg', c.tokens.bg);
          if (hex.test(c.tokens['gold-track'])) root.style.setProperty('--gold-track', c.tokens['gold-track']);
          if (hex.test(c.tokens['memory-track'])) root.style.setProperty('--memory-track', c.tokens['memory-track']);
          root.style.colorScheme = c.scheme === 'light' ? 'light' : 'dark';
          bar.setAttribute('content', c.tokens.bg);
        }
        // A mode other than Default paints its own ground (app.js MODE_CACHE).
        if (localStorage.getItem('forge2.mode') === 'playful') {
          root.dataset.bootMode = 'playful';
          bar.setAttribute('content', '#4B3FC9');
          // Opening on the cover game (app.js COVER_CACHE): the game's name and icon at once.
          var cover = JSON.parse(localStorage.getItem('forge2.cover') || 'null');
          if (cover && typeof cover.title === 'string') {
            root.dataset.bootCover = '1';
            document.title = cover.title;
            var icon = document.querySelector('link[rel="icon"]');
            if (/^\/v2\/[a-z0-9/._-]+\.svg$/.test(cover.icon)) {
              icon.dataset.appIcon = icon.getAttribute('href');
              icon.setAttribute('href', cover.icon);
            }
          }
        }
      }
    } catch (e) {} })();
  </script>
