<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forge AI (offline)</title>
  <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <style>
    :root { --bg: #f7f6f2; --text: #111317; --text-2: #464951; --line: #c9c5ba; --accent: #111317; --accent-text: #f7f6f2; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0d10; --text: #f2f0ea; --text-2: #bdbbb4; --line: #363c47; --accent: #f2f0ea; --accent-text: #0b0d10; } }
    :root[data-theme="dark"] { --bg: #0b0d10; --text: #f2f0ea; --text-2: #bdbbb4; --line: #363c47; --accent: #f2f0ea; --accent-text: #0b0d10; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; text-align: center;
    }
    main { max-width: 26rem; }
    svg { width: 56px; height: 39px; color: var(--text); }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { color: var(--text-2); margin: 0 0 20px; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 99px; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 26 18" aria-hidden="true"><path fill="currentColor" d="M0 2.6 6.2 0H25v5.2h-6.6c-1.5 1.3-2.1 3.6-2.1 5.9H21V18H4v-6.9h5.1c0-2.3-.6-4.6-2.1-5.9H6.2Z"/></svg>
    <h1>You're offline. Your chats are saved on this device.</h1>
    <p>This page needs a connection. Open Forge AI to read your chats; sending waits until you are back online.</p>
    <a href="/">Open Forge AI</a>
  </main>
</body>
</html>
