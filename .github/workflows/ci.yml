# CI: typecheck, unit, end-to-end, UI and Android checks on every pull request and every push to main.
#
# Read-only: it deploys nothing, pushes nothing and holds no secrets. Every action is pinned by commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Type-check and unit tests
        run: |
          pnpm typecheck
          pnpm test

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Natural voice files
        # Not in git: fetched pinned by commit and SHA-256 (scripts/phonon/lock.json), as the Dockerfile does.
        run: node scripts/phonon-model.ts

      - name: End-to-end and UI tests against local mints
        # The UI tests drive the runner's installed Chrome (channel: 'chrome'), so no browser is downloaded.
        run: |
          pnpm mint:up
          pnpm test:e2e
          pnpm test:ui

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        # The Capacitor runtime is read from node_modules (android/settings.gradle).
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Debug builds of both APKs and JVM tests
        # universal is Forge; privatevoice is Forge Private Voice, whose build fetches its speech to text
        # (about 79 MB from GitHub and Hugging Face, pinned and checked against scripts/asr/lock.json).
        working-directory: android
        run: ./gradlew assembleUniversalDebug assemblePrivatevoiceDebug testUniversalDebugUnitTest testPrivatevoiceDebugUnitTest

      - name: Native libraries load on 16 KB page phones
        # Android 15+ phones can use 16 KB pages; each stored .so must sit on a 16 KB boundary in the APK.
        working-directory: android
        run: |
          # A misaligned file makes zipalign fail; without pipefail the grep after it would hide that.
          set -o pipefail
          ZA=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          for apk in app/build/outputs/apk/universal/debug/app-universal-debug.apk app/build/outputs/apk/privatevoice/debug/app-privatevoice-debug.apk; do
            echo "$apk"
            "$ZA" -c -P 16 -v 4 "$apk" | grep -E 'lib/|Verification'
          done
          # The universal APK carries no speech to text model or runtime.
          if unzip -l app/build/outputs/apk/universal/debug/app-universal-debug.apk | grep -E 'libsherpa-onnx-jni\.so|\.ort$'; then
            echo "the universal APK carries Forge Private Voice's speech to text" >&2
            exit 1
          fi
