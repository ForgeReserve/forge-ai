# CI: typecheck, unit, end-to-end, UI and Android checks on every pull request and every push to main.
#
# Read-only: it deploys nothing, pushes nothing and holds no secrets. Every action is pinned by commit.
# docs/CI.md explains the jobs, the UI split, the skip rules and the repeat job. The one check to require
# is ci-ok: it always reports, and passes only when every job the change needs passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Which jobs this change needs (scripts/ci-changes.ts, tested in test/unit/ci.test.ts). A push to main
  # runs everything; so does any change to the build, the tooling or CI itself.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      e2e: ${{ steps.rules.outputs.e2e }}
      ui: ${{ steps.rules.outputs.ui }}
      android: ${{ steps.rules.outputs.android }}
      receiver: ${{ steps.rules.outputs.receiver }}
      ui_parts: ${{ steps.rules.outputs.ui_parts }}
      repeat: ${{ steps.rules.outputs.repeat }}
      repeat_count: ${{ steps.rules.outputs.repeat_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit: the first parent is the base branch, so
          # the diff between the two is what the pull request changes.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Decide what runs
        id: rules
        run: node scripts/ci-changes.ts

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Type-check and unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: The UI parts run every UI test file once
        # Asks Vitest which files each part's command runs, without running them (scripts/ui-split.ts).
        run: node scripts/ui-split.ts verify

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the local mints
        # In the background, with the Docker Hub retry: the image pulls while Node is set up.
        run: scripts/ci-mints.sh start

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Local mints
        run: scripts/ci-mints.sh wait

      - name: End-to-end tests against local mints
        # A docs-only change runs the docs page's test alone (docs/CI.md).
        env:
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          if [ "$E2E" = docs ]; then
            pnpm exec vitest run test/e2e/docs.e2e.test.ts
          else
            pnpm test:e2e
          fi

  # The UI suite in parts of about three minutes of tests each, dealt by recorded time
  # (scripts/ui-split.ts, test/ui/timings.json). `pnpm test:ui:linux` runs the same suite in Linux on a
  # Mac before a push.
  ui:
    needs: changes
    if: needs.changes.outputs.ui != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.changes.outputs.ui_parts) }}
    name: ui (${{ matrix.part }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the local mints
        run: scripts/ci-mints.sh start

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Natural voice files, kept between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/v2/voice/phonon
          key: phonon-${{ hashFiles('scripts/phonon/lock.json') }}

      - name: Natural voice files
        # Not in git: fetched pinned by commit and SHA-256 (scripts/phonon/lock.json), as the Dockerfile does.
        run: node scripts/phonon-model.ts

      - name: Local mints
        run: scripts/ci-mints.sh wait

      - name: UI tests against local mints
        # The UI tests drive the runner's installed Chrome (channel: 'chrome'), so no browser is downloaded.
        # Each file's time goes to a JSON report, kept below, to refresh test/ui/timings.json.
        env:
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = docs ]; then
            pnpm exec vitest run test/ui/docs.ui.test.ts
            exit 0
          fi
          PLAN=$(node scripts/ui-split.ts plan)
          echo "$PLAN"
          printf '## UI part %s of the plan\n\n~~~\n%s\n~~~\n' "$PART" "$PLAN" >>"$GITHUB_STEP_SUMMARY"
          FILES=$(node scripts/ui-split.ts files "$PART")
          if [ -z "$FILES" ]; then
            echo "part $PART has no files" >&2
            exit 1
          fi
          mapfile -t LIST <<<"$FILES"
          echo "part $PART runs: ${LIST[*]}"
          pnpm exec vitest run "${LIST[@]}" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/ui-times/ui-part-$PART.json"

      - name: Keep this part's test times
        if: matrix.part != 'docs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-times-${{ matrix.part }}
          path: ${{ runner.temp }}/ui-times/
          if-no-files-found: error
          retention-days: 30

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        # The Capacitor runtime is read from node_modules (android/settings.gradle).
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Debug builds of both APKs and JVM tests
        # universal is Forge; privatevoice is Forge Private Voice, whose build fetches its speech to text
        # (about 79 MB from GitHub and Hugging Face, pinned and checked against scripts/asr/lock.json).
        working-directory: android
        run: ./gradlew assembleUniversalDebug assemblePrivatevoiceDebug testUniversalDebugUnitTest testPrivatevoiceDebugUnitTest

      - name: Native libraries load on 16 KB page phones
        # Android 15+ phones can use 16 KB pages; each stored .so must sit on a 16 KB boundary in the APK.
        working-directory: android
        run: |
          # A misaligned file makes zipalign fail; without pipefail the grep after it would hide that.
          set -o pipefail
          ZA=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          for apk in app/build/outputs/apk/universal/debug/app-universal-debug.apk app/build/outputs/apk/privatevoice/debug/app-privatevoice-debug.apk; do
            echo "$apk"
            "$ZA" -c -P 16 -v 4 "$apk" | grep -E 'lib/|Verification'
          done
          # The universal APK carries no speech to text model or runtime.
          if unzip -l app/build/outputs/apk/universal/debug/app-universal-debug.apk | grep -E 'libsherpa-onnx-jni\.so|\.ort$'; then
            echo "the universal APK carries Forge Private Voice's speech to text" >&2
            exit 1
          fi

  # The Fedimint receiver (services/fedimint-receiver, docs/FEDIMINT-RECEIVER.md): formatting, clippy and its
  # tests against in-process federations. Only when its directory changes (or everything runs), so other
  # changes do not pay for compiling fedimint. The dependencies' build is cached by Cargo.lock.
  receiver:
    needs: changes
    if: needs.changes.outputs.receiver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/fedimint-receiver
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cargo registry and the dependencies' build, kept between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            services/fedimint-receiver/target
          key: receiver-${{ runner.os }}-${{ hashFiles('services/fedimint-receiver/Cargo.lock', 'services/fedimint-receiver/rust-toolchain.toml') }}
          restore-keys: receiver-${{ runner.os }}-

      - name: Toolchain
        # rustup reads rust-toolchain.toml and installs that version with rustfmt and clippy.
        run: |
          rustup toolchain install
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --profile ci --locked --all-targets -- -D warnings

      - name: Tests against in-process federations
        run: cargo test --profile ci --locked

  # On a pull request, each UI test file it adds or changes (or that imports a changed helper in test/ui)
  # runs 5 more times, so a test that passes four times in five fails here before it reaches main. A long
  # file's runs are spread over several jobs (scripts/ci-changes.ts).
  repeat:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.repeat_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.repeat) }}
    name: repeat (${{ matrix.label }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the local mints
        run: scripts/ci-mints.sh start

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Natural voice files, kept between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/v2/voice/phonon
          key: phonon-${{ hashFiles('scripts/phonon/lock.json') }}

      - name: Natural voice files
        run: node scripts/phonon-model.ts

      - name: Local mints
        run: scripts/ci-mints.sh wait

      - name: Run the changed UI test file again
        # Every run goes to the end, so the summary says how many of them passed.
        env:
          FILE: ${{ matrix.file }}
          RUNS: ${{ matrix.runs }}
          LABEL: ${{ matrix.label }}
        run: |
          pass=0
          fail=0
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i of $RUNS: $FILE"
            if pnpm exec vitest run "$FILE"; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              echo "::error file=$FILE::run $i of $RUNS failed"
            fi
            echo "::endgroup::"
          done
          echo "$LABEL: $pass of $RUNS extra runs of $FILE passed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ]

  # The one check to require. It always runs and reports: it fails if a job failed or was cancelled, or
  # was skipped although this change needs it; a job skipped by the rules is fine.
  ci-ok:
    if: always()
    needs: [changes, check, e2e, ui, android, receiver, repeat]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Every job this change needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-changes.ts verdict
