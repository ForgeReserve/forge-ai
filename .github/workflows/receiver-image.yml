name: Receiver image

# Builds the Fedimint receiver's image (services/fedimint-receiver/Dockerfile) and publishes it to the
# GitHub container registry, so a small host pulls it and never compiles fedimint itself
# (docs/FEDIMINT-RECEIVER.md, Turning it on). Runs when the receiver changes on main, or by hand.

on:
  push:
    branches: [main]
    paths:
      - 'services/fedimint-receiver/**'
      - '.github/workflows/receiver-image.yml'
  workflow_dispatch:

concurrency:
  group: receiver-image
  cancel-in-progress: false

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/forgereserve/forge-ai-fedimint-receiver
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" \
            services/fedimint-receiver

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker image inspect "$IMAGE:$GITHUB_SHA" --format 'published {{index .RepoDigests 0}}'
