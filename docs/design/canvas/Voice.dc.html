<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D10; color: #F1EFE9; font-family: Inter, sans-serif; display: flex; flex-direction: column; padding: 20px; gap: 18px">

<div style="font-family: Inter, sans-serif; font-weight: 600; font-size: 22px">Speak</div>
<div style="font-size: 14px; line-height: 1.45; color: #9A9DA3">Your voice can identify you. Choose where it is turned into text.</div>
</div>

<span style="font-size: 15px; font-weight: 600">On this phone</span>
<span style="font-size: 13px; line-height: 1.4; color: #9A9DA3">Audio never leaves. Only the text is sent. Free. Slower on older phones.</span>
</button>
<button style="text-align: left; padding: 14px 16px; background: #171A22; color: #F1EFE9; border: 1px solid #2A2F3A; border-radius: 14px; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">In the enclave</span>
<span style="font-size: 13px; line-height: 1.4; color: #9A9DA3">Encrypted audio goes to verified hardware and is deleted after transcription. More accurate. About [PRICE] per minute.</span>
</button>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
<div style="display: flex; align-items: center; gap: 5px; height: 56px" aria-hidden="true">

<div style="width: 5px; height: 56px; background: #3FCFB4; border-radius: 3px"></div>
<div style="width: 5px; height: 26px; background: #3FCFB4; border-radius: 3px"></div>
<div style="width: 5px; height: 36px; background: #3FCFB4; border-radius: 3px"></div>
<div style="width: 5px; height: 16px; background: #3FCFB4; border-radius: 3px"></div>
</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #9A9DA3">0:12</div>
<div style="max-width: 300px; text-align: center; font-size: 16px; line-height: 1.5">Summarise the notice I photographed and tell me what to bring on Saturday</div>
</div>
<button style="height: 64px; background: #F1EFE9; color: #0B0D10; border: 0; border-radius: 16px; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">Release to review text</button>
<div style="font-size: 12px; line-height: 1.4; color: #9A9DA3; text-align: center">You can edit the text before sending. The recording is erased either way.</div>
</div>
