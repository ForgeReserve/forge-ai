<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send as a voice note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #D9D6CD; color: #14161A; font-family: Inter, sans-serif; display: flex; flex-direction: column; padding-top: 24px">
<div style="flex: 1; background: #F6F5F1; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; padding: 10px 16px 20px; gap: 12px">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #C9C6BE"></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Send as a voice note</div>
<div style="font-size: 14px; line-height: 1.45; color: #5B6068">Changed on this phone. Your real voice is never sent.</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #FFFFFF; border: 1px solid #E3E0D8; border-radius: 16px; box-shadow: inset 0 -4px 0 rgba(20,22,26,0.08), inset 0 2px 0 rgba(255,255,255,0.75), 0 1px 2px rgba(20,22,26,0.08)">
<button aria-label="Play the changed voice" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #14161A; border: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#F6F5F1" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></button>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 15px; font-weight: 600">Listen before you send</div>
<div style="font-size: 13px; color: #5B6068">0:18, in the new voice</div>
</div>
</div>
<button aria-pressed="true" style="text-align: left; padding: 14px 16px; background: #FFFFFF; border: 2px solid #14161A; border-radius: 18px; color: #14161A; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 5px; box-shadow: inset 0 -4px 0 rgba(20,22,26,0.08), inset 0 2px 0 rgba(255,255,255,0.75), 0 1px 2px rgba(20,22,26,0.08)">
<span style="display: flex; justify-content: space-between; gap: 10px; align-items: baseline"><span style="font-size: 16px; font-weight: 600">New voice, same words</span><span style="font-size: 12px; color: #8A6410">Moderate protection</span></span>
<span style="font-size: 13px; line-height: 1.45; color: #5B6068">Works in any language or dialect. Harder to recognise, not impossible. Your rhythm and dialect stay.</span>
</button>
<button aria-disabled="true" style="text-align: left; padding: 14px 16px; background: transparent; border: 1px dashed #E3E0D8; border-radius: 18px; color: #14161A; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 5px">
<span style="display: flex; justify-content: space-between; gap: 10px; align-items: baseline"><span style="font-size: 16px; font-weight: 600">Read by a synthetic voice</span><span style="font-size: 12px; color: #0E7C6B">Strong protection</span></span>
<span style="font-size: 13px; line-height: 1.45; color: #5B6068">No trace of your voice. Tone is lost. Not reliable in the language you spoke, so it is turned off for this note.</span>
</button>
<button style="text-align: left; padding: 14px 16px; background: transparent; border: 1px solid #E3E0D8; border-radius: 18px; color: #14161A; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 5px">
<span style="display: flex; justify-content: space-between; gap: 10px; align-items: baseline"><span style="font-size: 16px; font-weight: 600">Type it instead</span><span style="font-size: 12px; color: #0E7C6B">No voice at all</span></span>
<span style="font-size: 13px; line-height: 1.45; color: #5B6068">The safest choice when you can write the message.</span>
</button>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 4px">
<div style="font-size: 15px">Voice</div>
<button style="min-height: 44px; padding: 0 14px; background: transparent; color: #14161A; border: 1px solid #E3E0D8; border-radius: 12px; font-family: Inter, sans-serif; font-size: 14px">Neutral 2. Change</button>
</div>
<div style="flex: 1"></div>
<div style="font-size: 13px; line-height: 1.45; color: #5B6068; padding: 0 4px">The original recording is erased when you send or cancel. Background sounds are removed.</div>
<button style="height: 56px; background: #14161A; color: #FFFFFF; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.45), inset 0 2px 0 rgba(255,255,255,0.14); border: 0; border-radius: 16px; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">Choose where to send</button>
</div>
</div>
</x-dc>

return {};

</body>
</html>
