<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add funds, wallet carousel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14161A}a:hover{color:#000}
a:focus-visible,button:focus-visible{outline:2px solid #0E7C6B;outline-offset:3px}
@keyframes c1in{0%{opacity:0;transform:translateY(8px) scale(0.98)}100%{opacity:1;transform:none}}
@keyframes c1hand{0%,100%{transform:translateX(6px)}50%{transform:translateX(-6px)}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #F6F5F1; font-family: Inter, system-ui, sans-serif; color: #14161A">

  <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="justify-self: center; margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap">Add funds</h1>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
      Listen
    </button>
  </div>

  <div style="position: absolute; top: 76px; left: 0; right: 0; display: flex; justify-content: center">
    <div style="height: 44px; padding: 0 14px 0 6px; border-radius: 22px; background: #FFFFFF; border: 1px solid #C9A24A; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="#F3E3BC" stroke-width="6"></circle></svg>
      $0.00

  </div>

  <div style="position: absolute; top: 160px; left: -267px; width: 300px; height: 380px; border-radius: 30px; background: {{prevBg}}; opacity: 0.9"></div>
  <div style="position: absolute; top: 160px; left: 357px; width: 300px; height: 380px; border-radius: 30px; background: {{nextBg}}; opacity: 0.9"></div>

  <div style="position: absolute; top: 140px; left: 45px; width: 300px; height: 420px; border-radius: 32px; background: {{cardBg}}; color: {{cardInk}}; overflow: hidden; box-shadow: inset 0 -7px 0 rgba(0,0,0,0.14), inset 0 2px 0 rgba(255,255,255,0.35), 0 18px 40px rgba(20,22,26,0.20)">
    <div style="position: absolute; top: 24px; left: 0; right: 0; height: 240px; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{isInvite}}" hint-placeholder-val="{{true}}">

          <g transform="rotate(-6 125 100)">
            <rect x="30" y="56" width="190" height="104" rx="9" fill="#8A6410" opacity="0.18" transform="translate(4 8)"></rect>
            <rect x="30" y="56" width="190" height="104" rx="9" fill="url(#c1pp)" stroke="#D9CBA3"></rect>

            <linearGradient id="c1bt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0BE"></stop><stop offset="0.45" stop-color="#E9C36A"></stop><stop offset="1" stop-color="#A97A24"></stop></linearGradient>

      <sc-if value="{{isCard}}" hint-placeholder-val="{{false}}">

          <g transform="rotate(-16 92 112)">
            <rect x="26" y="70" width="132" height="84" rx="12" fill="#000000" opacity="0.2" transform="translate(4 8)"></rect>
            <rect x="26" y="70" width="132" height="84" rx="12" fill="#FFF6DD"></rect>
            <rect x="40" y="90" width="24" height="18" rx="4" fill="#E9C36A" stroke="#8A6410" stroke-width="1.2"></rect>

      <sc-if value="{{isEcash}}" hint-placeholder-val="{{false}}">

          <defs>
            <linearGradient id="c1cf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0BE"></stop><stop offset="0.45" stop-color="#E9C36A"></stop><stop offset="1" stop-color="#B3802A"></stop></linearGradient>
            <linearGradient id="c1ce" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7A5512"></stop><stop offset="0.2" stop-color="#F6D98E"></stop><stop offset="0.55" stop-color="#A87A22"></stop><stop offset="1" stop-color="#5E410D"></stop></linearGradient>
          </defs>
          <ellipse cx="125" cy="170" rx="80" ry="12" fill="#8A6410" opacity="0.18"></ellipse>
          <path d="M65 140v16c0 9 27 16 60 16s60-7 60-16v-16z" fill="url(#c1ce)"></path><ellipse cx="125" cy="140" rx="60" ry="16" fill="url(#c1cf)"></ellipse>
          <path d="M65 110v16c0 9 27 16 60 16s60-7 60-16v-16z" fill="url(#c1ce)"></path><ellipse cx="125" cy="110" rx="60" ry="16" fill="url(#c1cf)"></ellipse>
          <path d="M65 80v16c0 9 27 16 60 16s60-7 60-16V80z" fill="url(#c1ce)"></path><ellipse cx="125" cy="80" rx="60" ry="16" fill="url(#c1cf)"></ellipse>
          <ellipse cx="125" cy="80" rx="40" ry="9" fill="none" stroke="#FFF4CF" stroke-width="2" opacity="0.8"></ellipse>
          <path d="M80 44l-6-10M125 38V24M170 44l6-10" stroke="#8A6410" stroke-width="4" stroke-linecap="round"></path>
        </svg>
      </sc-if>
      <sc-if value="{{isMore}}" hint-placeholder-val="{{false}}">
        <svg width="250" height="200" viewBox="0 0 250 200" role="img" aria-label="Three more ways: other mint, bitcoin, free questions">
          <circle cx="70" cy="100" r="44" fill="#E8E0FF"></circle>
          <path d="M52 86h36l-8-8M88 114H52l8 8" fill="none" stroke="#5B3FC4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="125" cy="64" r="40" fill="#F6E9C8"></circle>
          <path d="M106 58l12-6 12 6v12l-12 6-12-6zM120 70l12-6 12 6v12l-12 6-12-6z" fill="#E9C36A" stroke="#8A6410" stroke-width="2" stroke-linejoin="round"></path>
          <circle cx="182" cy="110" r="44" fill="#E9F5C9"></circle>
          <rect x="160" y="104" width="44" height="28" rx="4" fill="#7DB338"></rect><rect x="156" y="94" width="52" height="12" rx="3" fill="#9BD35A"></rect><rect x="178" y="94" width="8" height="38" fill="#D4A544"></rect>
        </svg>
      </sc-if>
    </div>
    <div style="position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 8px; animation: c1in 0.35s ease-out both">
      <span style="align-self: flex-start; height: 28px; padding: 0 10px; border-radius: 14px; background: {{badgeBg}}; color: {{badgeInk}}; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{badge}}</span>
      <span style="font-size: 32px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.05">{{word}}</span>
      <span style="font-size: 15px; opacity: 0.85">{{sub}}</span>
    </div>
  </div>

  <div role="tablist" aria-label="Ways to add funds" style="position: absolute; top: 584px; left: 16px; right: 16px; display: flex; justify-content: center; gap: 8px">
    <button type="button" role="tab" aria-label="Start free" onClick="{{go0}}" style="width: 52px; height: 52px; border-radius: 26px; border: {{ring0}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M15 7v10" stroke-dasharray="2 2"></path></svg>
    </button>
    <button type="button" role="tab" aria-label="Scan a note" onClick="{{go1}}" style="width: 52px; height: 52px; border-radius: 26px; border: {{ring1}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A6410" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg>
    </button>
    <button type="button" role="tab" aria-label="Lightning" onClick="{{go2}}" style="width: 52px; height: 52px; border-radius: 26px; border: {{ring2}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2.5 5 13.6h6.1l-1.2 7.9 8.2-11.1H12z" fill="#14161A"></path></svg>
    </button>
    <button type="button" role="tab" aria-label="Tap a card" onClick="{{go3}}" style="width: 52px; height: 52px; border-radius: 26px; border: {{ring3}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2459B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="15" height="11" rx="2.5"></rect><path d="M2 10h15M19 8a4 4 0 0 1 0 6M21.5 6a7 7 0 0 1 0 10"></path></svg>
    </button>
    <button type="button" role="tab" aria-label="eCash" onClick="{{go4}}" style="width: 52px; height: 52px; border-radius: 26px; border: {{ring4}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A6410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path></svg>
    </button>
    <button type="button" role="tab" aria-label="More ways" onClick="{{go5}}" style="width: 52px; height: 52px; border-radius: 26px; border: {{ring5}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#3F4348" aria-hidden="true"><circle cx="6" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="18" cy="12" r="2"></circle></svg>
    </button>
  </div>

  <div style="position: absolute; top: 656px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; color: #5B6068">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6068" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: c1hand 1.6s ease-in-out infinite"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5M12 10V4a1.5 1.5 0 0 1 3 0v6M15 10V6a1.5 1.5 0 0 1 3 0v7a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 5 16l-1.6-3a1.5 1.5 0 0 1 2.5-1.6L9 14"></path></svg>
    Swipe for other ways
  </div>

  <a href="{{ctaHref}}" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 64px; border-radius: 20px; background: #14161A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.45), inset 0 2px 0 rgba(255,255,255,0.14)">
    {{cta}}
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4A544" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const cards = [
      { key: 'invite', bg: 'linear-gradient(160deg, #18A08A 0%, #0E7C6B 55%, #0A5F52 100%)', ink: '#FFFFFF', word: 'Start free', sub: 'Have an invite code? Ask for free.', badge: 'No money needed', badgeBg: 'rgba(255,255,255,0.18)', badgeInk: '#FFFFFF', cta: 'Start free', href: 'AddFunds-C2.dc.html' },
      { key: 'note', bg: 'linear-gradient(160deg, #FFFDF6 0%, #F4ECD6 60%, #E9DCB8 100%)', ink: '#14161A', word: 'Scan a note', sub: 'Paper eCash. Point the camera.', badge: 'Not linked to you', badgeBg: '#E3F4F0', badgeInk: '#0A5F52', cta: 'Scan a note', href: 'AddFunds-C1.dc.html' },
      { key: 'lightning', bg: 'linear-gradient(160deg, #2A2F37 0%, #14161A 60%, #0B0D10 100%)', ink: '#FFFFFF', word: 'Lightning', sub: 'Pay from your wallet.', badge: 'Your wallet sees it', badgeBg: 'rgba(212,165,68,0.2)', badgeInk: '#F2CF78', cta: 'Use Lightning', href: 'AddFunds-C1.dc.html' },
      { key: 'card', bg: 'linear-gradient(160deg, #F2CF78 0%, #D4A544 55%, #B3802A 100%)', ink: '#14161A', word: 'Tap a card', sub: 'Hold it to the back of the phone.', badge: 'Android app', badgeBg: 'rgba(20,22,26,0.12)', badgeInk: '#14161A', cta: 'Tap a card', href: 'AddFunds-C1.dc.html' },
      { key: 'ecash', bg: 'linear-gradient(160deg, #FBF1D6 0%, #F6E9C8 60%, #EBD9A8 100%)', ink: '#14161A', word: 'Paste eCash', sub: 'From a wallet or a friend.', badge: 'Not linked to you', badgeBg: '#E3F4F0', badgeInk: '#0A5F52', cta: 'Paste eCash', href: 'AddFunds-C1.dc.html' },
      { key: 'more', bg: 'linear-gradient(160deg, #FFFFFF 0%, #F1EFE9 100%)', ink: '#14161A', word: 'More ways', sub: 'Other mint, Bitcoin, free questions.', badge: '3 more', badgeBg: '#F1EFE9', badgeInk: '#3F4348', cta: 'See more ways', href: 'AddFunds-C1.dc.html' },
    ];
    const i = this.state.i ?? 0;
    const c = cards[i];
    const n = cards.length;
    const vals = {
      cardBg: c.bg, cardInk: c.ink, word: c.word, sub: c.sub, badge: c.badge, badgeBg: c.badgeBg, badgeInk: c.badgeInk,
      cta: c.cta, ctaHref: c.href,
      prevBg: cards[(i + n - 1) % n].bg, nextBg: cards[(i + 1) % n].bg,
      isInvite: c.key === 'invite', isNote: c.key === 'note', isLightning: c.key === 'lightning',
      isCard: c.key === 'card', isEcash: c.key === 'ecash', isMore: c.key === 'more',
    };
    for (let k = 0; k < n; k++) {
      vals['go' + k] = () => this.setState({ i: k });
      vals['ring' + k] = k === i ? '3px solid #14161A' : '1px solid #E3E0D8';
    }
    return vals;
  }
}
</script>
</body>
