<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night: private by default</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:2px solid #3FCFB4;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #0B0D10; font-family: Inter, system-ui, sans-serif; color: #F5F5F7">
  <div style="position: absolute; top: 20px; left: 24px; right: 24px; height: 44px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
    <button aria-label="Listen" style="justify-self: start; height: 44px; border-radius: 22px; border: 1px solid rgba(63,207,180,0.45); background: rgba(63,207,180,0.10); display: flex; gap: 8px; align-items: center; padding: 0 16px 0 14px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #3FCFB4; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3FCFB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
      Listen
    </button>
    <div style="justify-self: center; display: flex; gap: 6px; align-items: center" role="img" aria-label="Step 4 of 4">
      <div style="width: 6px; height: 6px; border-radius: 3px; background: #F5F5F7"></div>
      <div style="width: 6px; height: 6px; border-radius: 3px; background: #F5F5F7"></div>
      <div style="width: 6px; height: 6px; border-radius: 3px; background: #F5F5F7"></div>
      <div style="width: 22px; height: 6px; border-radius: 3px; background: #F5F5F7"></div>
    </div>
    <div></div>
  </div>

  <div style="position: absolute; top: 92px; left: 45px; width: 300px; height: 300px">
    <svg width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="{{heroLabel}}">
      <defs>
        <radialGradient id="c4-aura" cx="50%" cy="50%" r="50%"><stop offset="0.5" stop-color="#3FCFB4" stop-opacity="0.24"></stop><stop offset="0.78" stop-color="#3FCFB4" stop-opacity="0.07"></stop><stop offset="1" stop-color="#3FCFB4" stop-opacity="0"></stop></radialGradient>
        <linearGradient id="c4-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7DC95"></stop><stop offset="0.5" stop-color="#E2B552"></stop><stop offset="1" stop-color="#C08A2A"></stop></linearGradient>
        <linearGradient id="c4-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8EF3DE"></stop><stop offset="0.5" stop-color="#3FCFB4"></stop><stop offset="1" stop-color="#1F9E87"></stop></linearGradient>
        <radialGradient id="c4-disc" cx="50%" cy="50%" r="50%" fx="34%" fy="28%"><stop offset="0" stop-color="#1E242C"></stop><stop offset="0.55" stop-color="#13171C"></stop><stop offset="1" stop-color="#090B0E"></stop></radialGradient>
        <radialGradient id="c4-discglow" cx="78%" cy="82%" r="60%"><stop offset="0" stop-color="{{glow}}" stop-opacity="0.22"></stop><stop offset="1" stop-color="{{glow}}" stop-opacity="0"></stop></radialGradient>
        <linearGradient id="c4-discrim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"></stop><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"></stop><stop offset="1" stop-color="#3FCFB4" stop-opacity="0.40"></stop></linearGradient>
        <linearGradient id="c4-shackle" gradientUnits="userSpaceOnUse" x1="104" y1="0" x2="196" y2="0"><stop offset="0.18" stop-color="#6A727E"></stop><stop offset="0.22" stop-color="#F1F4F8"></stop><stop offset="0.26" stop-color="#BAC1CB"></stop><stop offset="0.315" stop-color="#5E6672"></stop><stop offset="0.4" stop-color="#C9CFD7"></stop><stop offset="0.6" stop-color="#A9B0BA"></stop><stop offset="0.685" stop-color="#747C88"></stop><stop offset="0.72" stop-color="#E4E8ED"></stop><stop offset="0.76" stop-color="#AEB5BF"></stop><stop offset="0.815" stop-color="#59606B"></stop></linearGradient>
        <linearGradient id="c4-spec" gradientUnits="userSpaceOnUse" x1="0" y1="84" x2="0" y2="140"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
        <linearGradient id="c4-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4E8EE"></stop><stop offset="0.5" stop-color="#8F97A3"></stop><stop offset="1" stop-color="#454C57"></stop></linearGradient>
        <linearGradient id="c4-face" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#F7F9FB"></stop><stop offset="0.35" stop-color="#D3D8DF"></stop><stop offset="0.75" stop-color="#A9B0BB"></stop><stop offset="1" stop-color="#8A929E"></stop></linearGradient>
        <linearGradient id="c4-facerim" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"></stop><stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.08"></stop><stop offset="1" stop-color="#3FCFB4" stop-opacity="0.6"></stop></linearGradient>
        <linearGradient id="c4-hole" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0C10"></stop><stop offset="1" stop-color="#2A2F37"></stop></linearGradient>
        <linearGradient id="c4-vign" x1="0" y1="0" x2="0" y2="1"><stop offset="0.7" stop-color="#090B0E" stop-opacity="0"></stop><stop offset="1" stop-color="#090B0E" stop-opacity="0.7"></stop></linearGradient>
        <clipPath id="c4-clip"><circle cx="150" cy="150" r="81"></circle></clipPath>
        <clipPath id="c4-faceclip"><rect x="113" y="141" width="74" height="64" rx="13"></rect></clipPath>
        <filter id="c4-b05" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.6"></feGaussianBlur></filter>
        <filter id="c4-b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"></feGaussianBlur></filter>
        <filter id="c4-b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"></feGaussianBlur></filter>
        <filter id="c4-b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
        <filter id="c4-b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter>
      </defs>

      <circle cx="150" cy="150" r="150" fill="url(#c4-aura)"></circle>
      <g fill="none">
        <circle cx="150" cy="150" r="118" stroke="#E2B552" stroke-width="14" opacity="0.35" filter="url(#c4-b4)"></circle>
        <circle cx="150" cy="150" r="118" stroke="url(#c4-gold)" stroke-width="10"></circle>
        <circle cx="150" cy="150" r="94" stroke="#3FCFB4" stroke-width="14" opacity="0.35" filter="url(#c4-b4)"></circle>
        <circle cx="150" cy="150" r="94" stroke="url(#c4-teal)" stroke-width="10"></circle>
      </g>

      <circle cx="150" cy="150" r="82" fill="url(#c4-disc)"></circle>
      <circle cx="150" cy="150" r="82" fill="url(#c4-discglow)"></circle>

      <g clip-path="url(#c4-clip)">
        <ellipse cx="150" cy="146" rx="58" ry="52" fill="{{glow}}" opacity="0.10" filter="url(#c4-b8)"></ellipse>
        <ellipse cx="152" cy="212" rx="46" ry="6" fill="#000000" opacity="0.7" filter="url(#c4-b4)"></ellipse>
        <ellipse cx="150" cy="209" rx="38" ry="2.5" fill="#000000" opacity="0.6" filter="url(#c4-b1)"></ellipse>

        <path d="{{shackle}}" fill="none" stroke="#2E333B" stroke-width="13.6" stroke-linecap="round"></path>
        <path d="{{shackle}}" fill="none" stroke="url(#c4-shackle)" stroke-width="12" stroke-linecap="round"></path>
        <path d="{{shackle}}" fill="none" stroke="url(#c4-spec)" stroke-width="3" stroke-linecap="round" transform="translate(-2.6 -1.4)"></path>
        <path d="{{shackle}}" fill="none" stroke="#3FCFB4" stroke-opacity="0.45" stroke-width="1.2" transform="translate(5.2 0.6)" filter="url(#c4-b05)"></path>

        <rect x="110" y="138" width="80" height="70" rx="16" fill="url(#c4-edge)"></rect>
        <rect x="113" y="141" width="74" height="64" rx="13" fill="url(#c4-face)"></rect>
        <g clip-path="url(#c4-faceclip)">
          <ellipse cx="130" cy="152" rx="30" ry="12" fill="#FFFFFF" opacity="0.55" transform="rotate(-28 130 152)" filter="url(#c4-b4)"></ellipse>
          <path d="M113 186L152 141H162L113 198Z" fill="#FFFFFF" opacity="0.12"></path>
          <ellipse cx="172" cy="206" rx="34" ry="12" fill="#3B424D" opacity="0.35" filter="url(#c4-b4)"></ellipse>
        </g>
        <rect x="113.6" y="141.6" width="72.8" height="62.8" rx="12.4" fill="none" stroke="url(#c4-facerim)" stroke-width="1.2"></rect>
        <path d="M190 154V192A16 16 0 0 1 174 208" fill="none" stroke="#3FCFB4" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round" filter="url(#c4-b05)"></path>
        <ellipse cx="127" cy="139.4" rx="6.4" ry="1.8" fill="#14171B" opacity="{{holeOpacity}}"></ellipse>

        <path d="M150 157A8 8 0 0 1 154.6 171.5L156.6 186A2 2 0 0 1 154.6 188.3H145.4A2 2 0 0 1 143.4 186L145.4 171.5A8 8 0 0 1 150 157Z" fill="#FFFFFF" opacity="0.65" transform="translate(0.8 0.9)"></path>
        <path d="M150 157A8 8 0 0 1 154.6 171.5L156.6 186A2 2 0 0 1 154.6 188.3H145.4A2 2 0 0 1 143.4 186L145.4 171.5A8 8 0 0 1 150 157Z" fill="#000000" opacity="0.3" transform="translate(-0.6 -0.7)"></path>
        <path d="M150 157A8 8 0 0 1 154.6 171.5L156.6 186A2 2 0 0 1 154.6 188.3H145.4A2 2 0 0 1 143.4 186L145.4 171.5A8 8 0 0 1 150 157Z" fill="url(#c4-hole)"></path>
        <ellipse cx="150" cy="181" rx="2.6" ry="4.2" fill="{{glow}}" opacity="0.85" filter="url(#c4-b1)"></ellipse>
        <rect x="60" y="60" width="180" height="180" fill="url(#c4-vign)"></rect>
      </g>
      <circle cx="150" cy="150" r="81.5" fill="none" stroke="url(#c4-discrim)" stroke-width="1"></circle>
    </svg>
  </div>

  <div style="position: absolute; top: 416px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center">
    <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em">Private by default.</h1>
    <p style="margin: 0; max-width: 330px; font-size: 17px; line-height: 1.45; color: #A1A4AB">{{lead}}</p>
  </div>

  <button onClick="{{toggle}}" aria-pressed="{{on}}" style="position: absolute; top: 560px; left: 24px; right: 24px; min-height: 72px; border-radius: 22px; border: 1px solid {{cardBorder}}; background: {{cardFill}}; display: flex; align-items: center; gap: 14px; padding: 0 18px 0 14px; font-family: Inter, system-ui, sans-serif; color: #F5F5F7; text-align: left; cursor: pointer">
    <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{tileFill}}; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{stateColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="{{miniShackle}}"></path></svg>
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 18px; font-weight: 600">Private only</span>
      <span style="font-size: 15px; font-weight: 500; color: {{stateColor}}">{{stateWord}}</span>
    </span>
    <span style="width: 56px; height: 32px; flex-shrink: 0; border-radius: 16px; background: {{trackFill}}; display: flex; align-items: center; justify-content: {{knobSide}}; padding: 3px; box-sizing: border-box">
      <span style="width: 26px; height: 26px; border-radius: 13px; background: #F5F5F7; display: block; box-shadow: 0 2px 6px rgba(0,0,0,0.35)"></span>
    </span>
  </button>

  <a href="C-Welcome.dc.html" aria-label="Start" style="position: absolute; top: 664px; left: 157px; width: 76px; height: 76px; border-radius: 38px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 0 0 7px rgba(245,245,247,0.07), 0 0 0 8px rgba(245,245,247,0.12), 0 12px 34px rgba(63,207,180,0.30), inset 0 -2px 0 rgba(11,13,16,0.10)">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0B0D10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
  </a>

  <div style="position: absolute; top: 756px; left: 24px; right: 24px; display: flex; justify-content: center">
    <a href="#" style="height: 44px; min-width: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; font-weight: 500; text-decoration: none; color: #A1A4AB">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A4AB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5"></path><circle cx="12" cy="7.8" r="0.6" fill="#A1A4AB"></circle></svg>
      Learn more
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  renderVals() {
    const on = this.state.on;
    return {
      on: on ? 'true' : 'false',
      toggle: () => this.setState({ on: !this.state.on }),
      heroLabel: on ? 'A closed padlock, inside two fully lit rings.' : 'An open padlock, inside two fully lit rings.',
      shackle: on ? 'M127 142V116a23 23 0 0 1 46 0v26' : 'M173 142V108a23 23 0 0 0-46 0v10',
      miniShackle: on ? 'M8 11V8a4 4 0 0 1 8 0v3' : 'M16 11V7a4 4 0 0 0-8 0v1',
      holeOpacity: on ? '0' : '0.85',
      glow: on ? '#3FCFB4' : '#FF8A78',
      cardBorder: on ? 'rgba(63,207,180,0.45)' : 'rgba(255,255,255,0.14)',
      cardFill: on ? 'rgba(63,207,180,0.10)' : 'rgba(255,255,255,0.04)',
      tileFill: on ? 'rgba(63,207,180,0.16)' : 'rgba(255,138,120,0.12)',
      stateColor: on ? '#3FCFB4' : '#FF8A78',
      stateWord: on ? 'On' : 'Off',
      trackFill: on ? '#0E7C6B' : '#3A3D44',
      knobSide: on ? 'flex-end' : 'flex-start',
      lead: on ? 'Only private models. Forge cannot read what you type.' : 'Standard models are shown too. They can read what you type.'
    };
  }
}
</script>
</body>
</html>
