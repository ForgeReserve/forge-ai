<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover picker</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D10; color: #F1EFE9; font-family: Inter, sans-serif; display: flex; flex-direction: column; padding-top: 24px">

<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Choose a cover</div>
<div style="font-size: 14px; line-height: 1.45; color: #9A9DA3">The name, icon and game people see on this phone. Pick any, or make your own.</div>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px">
<button aria-pressed="true" style="padding: 12px 6px; background: #111317; border: 2px solid #F1EFE9; border-radius: 18px; color: #F1EFE9; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 6px">

<span style="font-size: 14px; font-weight: 600">Momo Orchard</span>
<span style="font-size: 12px; color: #9A9DA3">Match three</span>
</button>
<button style="padding: 12px 6px; background: transparent; border: 1px solid #2A2F3A; border-radius: 18px; color: #F1EFE9; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="15" fill="#4B3FC9"></rect><rect x="14" y="16" width="32" height="30" rx="8" fill="#FFD23F"></rect><circle cx="24" cy="29" r="2.5" fill="#1B1440"></circle><circle cx="36" cy="29" r="2.5" fill="#1B1440"></circle><path d="M25 37c3 3 7 3 10 0" stroke="#1B1440" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 14px; font-weight: 600">Zuri Blocks</span>
<span style="font-size: 12px; color: #9A9DA3">Block puzzle</span>
</button>
<button style="padding: 12px 6px; background: transparent; border: 1px solid #2A2F3A; border-radius: 18px; color: #F1EFE9; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="15" fill="#7FD4FF"></rect><circle cx="30" cy="30" r="14" fill="#FFC21A"></circle><path d="M30 8v6M30 46v6M8 30h6M46 30h6M14 14l4 4M42 42l4 4M46 14l-4 4M18 42l-4 4" stroke="#FFC21A" stroke-width="3" stroke-linecap="round"></path><circle cx="25" cy="28" r="2" fill="#1B1440"></circle><circle cx="35" cy="28" r="2" fill="#1B1440"></circle><path d="M26 34c2 2 6 2 8 0" stroke="#1B1440" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 14px; font-weight: 600">Sol Dash</span>
<span style="font-size: 12px; color: #9A9DA3">Runner</span>
</button>
<button style="padding: 12px 6px; background: transparent; border: 1px solid #2A2F3A; border-radius: 18px; color: #F1EFE9; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="15" fill="#1B1440"></rect><path d="M22 18h16l4 24a12 6 0 0 1-24 0z" fill="#FFD23F"></path><rect x="24" y="12" width="12" height="6" rx="2" fill="#FF8A7A"></rect><circle cx="26" cy="31" r="2" fill="#1B1440"></circle><circle cx="34" cy="31" r="2" fill="#1B1440"></circle><path d="M27 37c2 2 4 2 6 0" stroke="#1B1440" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 14px; font-weight: 600">Noor Lanterns</span>
<span style="font-size: 12px; color: #9A9DA3">Memory pairs</span>
</button>
<button style="padding: 12px 6px; background: transparent; border: 1px solid #2A2F3A; border-radius: 18px; color: #F1EFE9; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="15" fill="#2C2A6B"></rect><path d="M30 10l6 13 14 1.5-10.5 9.5 3.2 14L30 40.5 17.3 48l3.2-14L10 24.500 24 23z" fill="#FFD23F"></path><circle cx="26" cy="29" r="2" fill="#1B1440"></circle><circle cx="34" cy="29" r="2" fill="#1B1440"></circle><path d="M27 34c2 2 4 2 6 0" stroke="#1B1440" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 14px; font-weight: 600">Tala Stars</span>
<span style="font-size: 12px; color: #9A9DA3">Connect the dots</span>
</button>
<button style="padding: 12px 6px; background: transparent; border: 1px solid #2A2F3A; border-radius: 18px; color: #F1EFE9; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="15" fill="#3DDC97"></rect><path d="M12 40c6-6 12-6 18 0s12 6 18 0v12H12z" fill="#1E7FBF"></path><circle cx="30" cy="26" r="12" fill="#FFFFFF"></circle><circle cx="26" cy="25" r="2" fill="#1B1440"></circle><circle cx="34" cy="25" r="2" fill="#1B1440"></circle><path d="M27 30c2 2 4 2 6 0" stroke="#1B1440" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 14px; font-weight: 600">Kai Waves</span>
<span style="font-size: 12px; color: #9A9DA3">Fishing game</span>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="cname" style="font-size: 13px; color: #9A9DA3; padding: 0 4px">Or your own name</label>
<input id="cname" type="text" placeholder="Any name, in any language" style="height: 52px; box-sizing: border-box; background: #111317; color: #F1EFE9; border: 1px solid #2A2F3A; border-radius: 16px; padding: 0 16px; font-family: Inter, sans-serif; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; border: 1px solid #2A2F3A; border-radius: 18px; background: #111317">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #2A2F3A; font-size: 15px">
<div>How to open the helper</div>
<div style="color: #F1EFE9">Hold the character</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 16px; font-size: 15px">
<div>Change cover later</div>
<div style="color: #3FCFB4">Any time</div>
</div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 10px">
<button style="flex: 1; height: 56px; background: transparent; color: #F1EFE9; border: 1px solid #2A2F3A; border-radius: 16px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500">Surprise me</button>
<button style="flex: 2; height: 56px; background: #F1EFE9; color: #0B0D10; border: 0; border-radius: 16px; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">Use this cover</button>
</div>
</div>
</div>
</x-dc>

return {};
}

</script>
</body>
</html>
